name: Azure Web App (Container)

on:
  workflow_run:
    workflows: [ "Docker Publish" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'GHCR image tag (e.g. sha-abc1234 or v1.2.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: azure-container
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: azure-container
      url: ${{ vars.APP_URL }}
    permissions:
      id-token: write
      contents: read
    env:
      IMAGE: ghcr.io/alinapavlenk18/gha-ci-lab
    steps:
      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$INPUT_TAG" ]; then TAG="$INPUT_TAG"; else TAG="sha-${RUN_SHA:0:7}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying $IMAGE:$TAG"
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy container image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - name: Smoke check
        run: |
          curl -fsS --retry 18 --retry-delay 10 --retry-all-errors "${{ vars.APP_URL }}/health"
          curl -fsS "${{ vars.APP_URL }}/"
name: Azure Web App (Node)

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/azure-webapp.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: azure-webapp
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Assemble deployment package (dist + prod node_modules)
        run: |
          mkdir -p package
          cp -r dist package.json package-lock.json package/
          cd package && npm ci --omit=dev
      - uses: actions/upload-artifact@v7
        with:
          name: webapp-package
          path: package/
          retention-days: 7

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: azure-staging
      url: ${{ vars.APP_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webapp-package
          path: package
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set APP_VERSION
        run: |
          az webapp config appsettings set -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_WEBAPP_NAME }}" --settings APP_VERSION=${{ github.sha }} -o none
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: package
      - name: Smoke check
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${{ vars.APP_URL }}/health"
          curl -fsS "${{ vars.APP_URL }}/" | tee /dev/stderr | grep -q "${{ github.sha }}"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: azure-production
      url: ${{ vars.APP_URL }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: webapp-package
          path: package
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set APP_VERSION
        run: |
          az webapp config appsettings set -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ vars.AZURE_WEBAPP_NAME }}" --settings APP_VERSION=${{ github.sha }} -o none
      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: package
      - name: Smoke check
        run: |
          curl -fsS --retry 12 --retry-delay 10 --retry-all-errors "${{ vars.APP_URL }}/health"
          curl -fsS "${{ vars.APP_URL }}/" | tee /dev/stderr | grep -q "${{ github.sha }}"